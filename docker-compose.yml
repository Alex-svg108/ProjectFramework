version: '3.10'

services:

  redis:
    image: redis:latest
    expose:
      - '6379'

  db:
    image: postgres:17
    env_file:
      - .env
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -h localhost"]
      interval: 30s
      timeout: 10s
      retries: 5

  web:
    build: .
    command: >
      bash -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment:
      - DATABASE_HOST=db
    env_file:
      - .env
    volumes:
      - .:/code
      - static_volume:/code/static
    ports:
      - "8000:8000"
    depends_on:
      - db

  celery:
    build: .
    tty: true
    command: celery -A config worker -l info
    restart: on-failure
    volumes:
      - .:/code
    depends_on:
      - redis
      - db
      - web
    env_file:
      - .env

  celery-beat:
    build: .
    tty: true
    command: celery -A config beat -l info
    restart: on-failure
    volumes:
      - .:/code
    depends_on:
      - redis
      - db
      - web
    env_file:
      - .env

volumes:
  postgres_data:
  static_volume:
